<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="3840" viewBox="0 0 540 960" fill="none">
  <title>Baymax with a soccer ball</title>
  <desc>A monochrome illustration of Baymax standing front-facing with relaxed arms and a soccer ball beside his feet.</desc>
  <defs>
    <radialGradient id="backdrop"><stop stop-color="#252525"/><stop offset="1" stop-color="#0c0c0c"/></radialGradient>
    <radialGradient id="vinyl" cx="0" cy="0" r="1" gradientTransform="translate(220 390) rotate(68) scale(380 255)" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset=".5" stop-color="#f0f1f2"/><stop offset=".84" stop-color="#cdd0d3"/><stop offset="1" stop-color="#9da2a8"/></radialGradient>
    <radialGradient id="face" cx="0" cy="0" r="1" gradientTransform="translate(250 219) rotate(70) scale(98 135)" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset=".58" stop-color="#f3f4f5"/><stop offset="1" stop-color="#b9bec4"/></radialGradient>
    <linearGradient id="leftArm" x1="130" y1="368" x2="88" y2="694" gradientUnits="userSpaceOnUse"><stop stop-color="#eeeef0"/><stop offset=".46" stop-color="#e4e6e8"/><stop offset="1" stop-color="#b8bdc3"/></linearGradient>
    <linearGradient id="rightArm" x1="405" y1="379" x2="450" y2="695" gradientUnits="userSpaceOnUse"><stop stop-color="#d4d8dc"/><stop offset=".6" stop-color="#bfc4ca"/><stop offset="1" stop-color="#989fa7"/></linearGradient>
    <linearGradient id="legs" x1="220" y1="675" x2="300" y2="829" gradientUnits="userSpaceOnUse"><stop stop-color="#d9dce0"/><stop offset="1" stop-color="#a9b0b8"/></linearGradient>
    <radialGradient id="ball" cx=".32" cy=".25" r=".8"><stop stop-color="#fff"/><stop offset=".6" stop-color="#d8dcdf"/><stop offset="1" stop-color="#8d959d"/></radialGradient>
    <radialGradient id="ground"><stop stop-color="#000" stop-opacity=".8"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="floor" x1="270" y1="740" x2="270" y2="960" gradientUnits="userSpaceOnUse"><stop stop-color="#171717" stop-opacity="0"/><stop offset="1" stop-color="#242424"/></linearGradient>
    <clipPath id="ballClip"><circle cx="86" cy="817" r="36"/></clipPath>
  </defs>
