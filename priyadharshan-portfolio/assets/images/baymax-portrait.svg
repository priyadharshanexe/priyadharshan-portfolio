  <path fill="url(#floor)" d="M0 725h540v235H0z"/>
  <ellipse cx="273" cy="837" rx="185" ry="33" fill="url(#ground)"/>
  <ellipse cx="86" cy="854" rx="51" ry="12" fill="url(#ground)"/>
