  <path d="M193 663c-10 38-15 81-12 123 1 29 17 44 45 45 26 1 42-12 43-37l3-115-79-16Z" fill="url(#legs)"/>
  <path d="m279 675 2 119c1 25 16 38 43 37 28-1 43-17 43-44 1-45-5-86-17-123l-71 11Z" fill="url(#legs)"/>
  <path d="M191 793c14 10 43 15 65 6m39 1c18 8 43 5 60-7" stroke="#7f8994" stroke-opacity=".22" stroke-width="2" stroke-linecap="round"/>
  <!-- Both arms hang naturally beside the body. -->
  <path d="M167 327c-29 1-52 23-68 58-26 56-42 130-42 197 0 34 4 63 15 84 6 11 17 14 27 8 11-6 13-18 8-31-7-20-8-43-4-67 7-50 25-95 53-132 28-37 44-99 11-117Z" fill="url(#leftArm)"/>
  <path d="M376 329c29 0 54 23 69 58 26 59 41 129 41 194 0 35-5 63-16 83-6 12-17 15-27 9-11-6-13-18-8-31 7-21 8-43 4-67-7-49-25-94-52-131-27-37-44-98-11-115Z" fill="url(#rightArm)"/>
  <path d="M72 636c-7 13-9 32-3 48 5 12 10 22 18 23 7 1 10-6 8-14 9 9 17 7 18-1 1-4-1-9-3-13 8 5 15 0 13-8-3-12-16-23-22-35H72Z" fill="url(#leftArm)"/>
  <path d="M443 637c-8 11-20 23-23 35-2 8 5 13 13 8-3 5-4 10-3 14 2 8 10 9 18 0-1 8 2 15 8 14 9-1 15-12 20-24 6-16 3-35-4-48l-29 1Z" fill="url(#rightArm)"/>
  <path d="m83 673 8 17m8-20 9 13m340-9-8 13m23-12-8 17" stroke="#949da6" stroke-opacity=".32" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Inflatable pear-shaped torso. -->
  <path d="M218 295c-32 7-57 31-76 75-26 60-43 134-39 198 5 89 53 143 168 143 116 0 164-54 169-143 4-64-13-138-40-198-19-44-44-68-76-75-27-6-78-6-106 0Z" fill="url(#vinyl)"/>
