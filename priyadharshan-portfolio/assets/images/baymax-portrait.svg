  <path d="M132 615c23 45 68 70 139 70s117-25 140-69" stroke="#9ba3ac" stroke-opacity=".2" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="332" cy="385" rx="20" ry="22" transform="rotate(-15 332 385)" fill="#dde1e5" fill-opacity=".42" stroke="#b7bfc7" stroke-width="1.5"/>
  <path d="m316 383 12 4 8-6 12 4" stroke="#aeb7c0" stroke-opacity=".6" stroke-width="1.3" stroke-linecap="round"/>
