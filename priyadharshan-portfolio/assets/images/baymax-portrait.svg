  <ellipse cx="271" cy="252" rx="82" ry="53" fill="url(#face)"/>
  <path d="M239 248h64" stroke="#17191b" stroke-width="3.2" stroke-linecap="round"/>
  <ellipse cx="238" cy="248" rx="6.5" ry="7" fill="#17191b"/>
  <ellipse cx="304" cy="248" rx="6.5" ry="7" fill="#17191b"/>
  <!-- Soccer ball, following the reference placement. -->
  <circle cx="86" cy="817" r="36" fill="url(#ball)"/>
  <g clip-path="url(#ballClip)" stroke="#4e565e" stroke-width=".8" stroke-linejoin="round">
    <path d="m81 802 14 2 5 14-11 9-13-9Z" fill="#292d32"/>
    <path d="m53 801 13-7 8-12-16 1Z" fill="#25292e"/>
    <path d="m108 788-3 15 14 9 9-14Z" fill="#343940"/>
    <path d="m55 824 13 1 4 15-13 9-12-11Z" fill="#30353b"/>
    <path d="m95 839 15-7 10 10-11 15-15-3Z" fill="#252a30"/>
    <path d="m81 802-7-20m21 22 10-1m-5 15 10 14m-21-5 6 12m-19-21-8 7m4 15 22 14m-28-60 15 8m38 10-9 20" fill="none" stroke="#8c949d"/>
